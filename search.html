<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tynorah — Search</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="feed-body">

  <nav class="sidebar">
    <div class="brand">TYNORAH</div>
    <ul class="nav-links">
      <li><a href="feed.html"><i class="fa-solid fa-house"></i> <span>Home</span></a></li>
      <li><a href="#" class="active"><i class="fa-solid fa-magnifying-glass"></i> <span>Search</span></a></li>
      <li><a href="#"><i class="fa-solid fa-square-plus"></i> <span>Create</span></a></li>
      <li><a href="profile.html"><i class="fa-solid fa-user"></i> <span>Profile</span></a></li>
    </ul>
    <a href="index.html" class="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </nav>

  <main class="feed-container">
    <div class="search-section">
      <div class="search-bar-wrapper">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Search creators, hashtags or tech...">
      </div>
      
      <div class="search-results">
        <p class="small" style="text-align: left; margin-bottom: 20px;">Recent searches</p>
        <div class="user-info" style="margin-bottom: 15px;">
          <div class="avatar" style="background: #ddd;"></div>
          <span class="username">WebArchitect_99</span>
        </div>
        <div class="user-info">
          <div class="avatar" style="background: #ddd;"></div>
          <span class="username">UI_Master</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
