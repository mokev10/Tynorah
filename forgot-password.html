<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tynorah — Forgot Password</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #f5f5f5;
      position: relative;
    }
    .container {
      width: 450px;
      max-width: 92vw;
      background: #fff;
      border-radius: 60px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      position: absolute; /* nécessaire pour JS */
      padding: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="brand">TYNORAH</div>
    <h1>RESET PASSWORD</h1>
    <p class="subtitle">Enter your email to receive a reset link</p>
  </header>

  <form id="forgot-form" class="content" action="#" method="POST">
    <div style="margin-top: 20px;">
      <label for="reset-email">Email Address</label>
      <input id="reset-email" type="email" placeholder="example@email.com" required>
    </div>

    <p class="consent" style="text-align: left; margin-top: 15px;">
      We will send you a secure link to update your password. Please check your spam folder if you don't see it.
    </p>

    <button class="btn" type="submit" style="margin-top: 20px;">SEND RESET LINK</button>

    <p class="small">
      Wait, I remember it! <a href="signin.html" class="signin-link">Back to login</a>
    </p>
  </form>
</div>

<script>
  // Fonction pour centrer le container
  function centerContainer() {
    const container = document.querySelector('.container');
    const winWidth = window.innerWidth;
    const winHeight = window.innerHeight;
    const contWidth = container.offsetWidth;
    const contHeight = container.offsetHeight;

    const left = (winWidth - contWidth) / 2;
    const top = (winHeight - contHeight) / 2;

    container.style.left = left + 'px';
    container.style.top = top + 'px';
  }

  window.addEventListener('load', centerContainer);
  window.addEventListener('resize', centerContainer);

  // Gestion du formulaire
  document.getElementById('forgot-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('reset-email').value.trim();
    if(email !== ""){
      alert("Si un compte est associé à " + email + ", un lien de réinitialisation sera envoyé.");
      // Redirection vers la page de connexion après validation
      window.location.href = "signin.html";
    } else {
      alert("Veuillez entrer une adresse email valide.");
    }
  });
</script>

</body>
</html>
